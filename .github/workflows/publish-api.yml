name: Publish Instance Manager API

on:
  push:
    tags:
      - '*'

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: instance-manager
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure tag is on master
        id: check
        run: |
          if git merge-base --is-ancestor "$GITHUB_SHA" origin/master; then
            echo "on_master=true" >> "$GITHUB_OUTPUT"
          else
            echo "Tag ${GITHUB_REF_NAME} does not point to a commit on master, skipping publication."
            echo "on_master=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up JDK
        if: steps.check.outputs.on_master == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        if: steps.check.outputs.on_master == 'true'
        uses: gradle/actions/setup-gradle@v4

      - name: Publish API
        if: steps.check.outputs.on_master == 'true'
        run: ./gradlew :api:publish -PreleaseVersion="${GITHUB_REF_NAME#v}"
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
